title: Matt Rosenberg
description: "Communications professional, writer and photographer. Writing about tech, brands, music, and the places I've been."
default_image: /assets/images/rosenberg_headshot.webp
url: "https://mattjrosenberg.com"

# https://jekyllrb.com/docs/configuration/options/
timezone: America/New_York

# Netlify doesn't need .htaccess
# include: [".htaccess"]

exclude: ["_includes/notes_graph.json", "obsidian-templates", "CLAUDE.md", ".obsidian", "tasks"]

# Netlify handles clean URLs
use_html_extension: false

# Show graph at bottom of notes (hidden for now)
show_notes_graph: false

open_external_links_in_new_tab: true

permalink: /:year/:month/:day/:slug

page_excerpts: true

plugins:
  - jekyll-last-modified-at
  - jekyll-sitemap

collections:
  notes:
    output: true
    permalink: /:slug

  pages:
    output: true
    permalink: /:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
  - scope:
      path: "_posts/**/*.md"
    values:
      layout: "post"
  - scope:
      path: "admin"
    values:
      sitemap: false
