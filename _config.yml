title: Matt Rosenberg
url: "https://mattjrosenberg.com"

# https://jekyllrb.com/docs/configuration/options/
timezone: America/New_York

# Netlify doesn't need .htaccess
# include: [".htaccess"]

exclude: ["_includes/notes_graph.json", "obsidian-templates", "CLAUDE.md", ".obsidian"]

# Netlify handles clean URLs
use_html_extension: false

# Show graph at bottom of notes (hidden for now)
show_notes_graph: false

open_external_links_in_new_tab: true

permalink: slug

page_excerpts: true

plugins:
  - jekyll-last-modified-at

collections:
  notes:
    output: true
    permalink: /:slug

  pages:
    output: true
    permalink: /:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"
