<script src="/assets/js/d3.min.js" crossorigin="anonymous"></script>

<div id="graph-wrapper">
  <script>
    const MIN_NODE_SIZE = 8;
    const MAX_NODE_SIZE = 12;
    const ACTIVE_RADIUS_FACTOR = 1.5;
    const STROKE = 1;
    const FONT_SIZE = 16;
    const TICKS = 200;
    const FONT_BASELINE = 40;
    const MAX_LABEL_LENGTH = 50;

    const graphData = {% include notes_graph.json %};
    var nodesData = graphData.nodes;
    var linksData = graphData.edges;

    const nodeSize = {};

    function updateNodeSize() {
      nodesData.forEach(function(el) {
        var linkCount = linksData.filter(function(l) {
          return l.source === el.id || l.target === el.id;
        }).length;
        var weight = 3 * Math.sqrt(linkCount + 1);
        nodeSize[el.id] = Math.min(Math.max(weight, MIN_NODE_SIZE), MAX_NODE_SIZE);
      });
    }

    function onClick(d) {
      window.location = d.path;
    }

    function onMouseover(d) {
      var relatedNodes = new Set();
      linksData
        .filter(function(n) { return n.target.id == d.id || n.source.id == d.id; })
        .forEach(function(n) {
          relatedNodes.add(n.target.id);
          relatedNodes.add(n.source.id);
        });

      function isRelated(nodeId) {
        return nodeId === d.id || relatedNodes.has(nodeId);
      }

      node.attr("class", function(nd) { return isRelated(nd.id) ? "" : "inactive"; });
      link.attr("class", function(ld) {
        return (ld.source.id === d.id || ld.target.id === d.id) ? "" : "inactive";
      });
      link.attr("stroke-width", function(ld) {
        return (ld.source.id === d.id || ld.target.id === d.id) ? STROKE * 4 : STROKE;
      });
      text.attr("class", function(td) { return isRelated(td.id) ? "" : "inactive"; });
    }

    function onMouseout() {
      node.attr("class", "");
      link.attr("class", "");
      text.attr("class", "");
      link.attr("stroke-width", STROKE);
    }

    var graphWrapper = document.getElementById('graph-wrapper');
    var element = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    element.setAttribute("width", graphWrapper.getBoundingClientRect().width);
    element.setAttribute("height", window.innerHeight * 0.8);
    graphWrapper.appendChild(element);

    window.onresize = function() {
      element.setAttribute("width", window.innerWidth);
      element.setAttribute("height", window.innerHeight);
    };

    var svg = d3.select("svg");
    var width = Number(svg.attr("width"));
    var height = Number(svg.attr("height"));
    var zoomLevel = 1;

    var simulation = d3
      .forceSimulation(nodesData)
      .force("forceX", d3.forceX().x(width / 2))
      .force("forceY", d3.forceY().y(height / 2))
      .force("charge", d3.forceManyBody())
      .force("link", d3.forceLink(linksData).id(function(d) { return d.id; }).distance(70))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collision", d3.forceCollide().radius(80))
      .stop();

    var g = svg.append("g");
    var link = g.append("g").attr("class", "links").selectAll(".link");
    var node = g.append("g").attr("class", "nodes").selectAll(".node");
    var text = g.append("g").attr("class", "text").selectAll(".text");

    function resize() {
      if (d3.event) {
        var scale = d3.event.transform;
        zoomLevel = scale.k;
        g.attr("transform", scale);
      }

      function zoomOrKeep(value) {
        return zoomLevel >= 1 ? value / zoomLevel : value;
      }

      var font = Math.max(Math.round(zoomOrKeep(FONT_SIZE)), 1);

      text.attr("font-size", font);
      text.attr("y", function(d) { return d.y - zoomOrKeep(FONT_BASELINE) + 8; });
      link.attr("stroke-width", zoomOrKeep(STROKE));
      node.attr("r", function(d) { return zoomOrKeep(nodeSize[d.id]); });
      svg
        .selectAll("circle")
        .filter(function(_d, i, nodes) { return d3.select(nodes[i]).attr("active"); })
        .attr("r", function(d) { return zoomOrKeep(ACTIVE_RADIUS_FACTOR * nodeSize[d.id]); });
    }

    function ticked() {
      node.attr("cx", function(d) { return d.x; }).attr("cy", function(d) { return d.y; });
      text
        .attr("x", function(d) { return d.x; })
        .attr("y", function(d) { return d.y - (FONT_BASELINE - nodeSize[d.id]) / zoomLevel; });
      link
        .attr("x1", function(d) { return d.source.x; })
        .attr("y1", function(d) { return d.source.y; })
        .attr("x2", function(d) { return d.target.x; })
        .attr("y2", function(d) { return d.target.y; });
    }

    function restart() {
      updateNodeSize();

      node = node.data(nodesData, function(d) { return d.id; });
      node.exit().remove();
      node = node
        .enter()
        .append("circle")
        .attr("r", function(d) { return nodeSize[d.id]; })
        .on("click", onClick)
        .on("mouseover", onMouseover)
        .on("mouseout", onMouseout)
        .merge(node);

      link = link.data(linksData, function(d) { return d.source.id + "-" + d.target.id; });
      link.exit().remove();
      link = link.enter().append("line").attr("stroke-width", STROKE).merge(link);

      text = text.data(nodesData, function(d) { return d.label; });
      text.exit().remove();
      text = text
        .enter()
        .append("text")
        .text(function(d) { return shorten(d.label.replace(/_*/g, ""), MAX_LABEL_LENGTH); })
        .attr("font-size", FONT_SIZE + "px")
        .attr("text-anchor", "middle")
        .attr("alignment-baseline", "central")
        .on("click", onClick)
        .on("mouseover", onMouseover)
        .on("mouseout", onMouseout)
        .merge(text);

      node.attr("active", function(d) { return isCurrentPath(d.path) ? true : null; });
      text.attr("active", function(d) { return isCurrentPath(d.path) ? true : null; });

      simulation.nodes(nodesData);
      simulation.force("link").links(linksData);
      simulation.alpha(1).restart();
      simulation.stop();

      for (var i = 0; i < TICKS; i++) {
        simulation.tick();
      }

      ticked();
    }

    function isCurrentPath(notePath) {
      return window.location.pathname.includes(notePath);
    }

    function shorten(str, maxLen, separator) {
      separator = separator || ' ';
      if (str.length <= maxLen) return str;
      return str.substr(0, str.lastIndexOf(separator, maxLen)) + '...';
    }

    var zoomHandler = d3.zoom().scaleExtent([0.2, 3]).on("zoom", resize);
    zoomHandler(svg);
    restart();
  </script>
</div>
