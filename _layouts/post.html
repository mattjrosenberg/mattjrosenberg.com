---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <header><p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p></header>

  {% if page.image %}
  <figure>
    <img src="{{ page.image }}" alt="{{ page.title }}">
    {% if page.image_caption %}<figcaption>{{ page.image_caption }}</figcaption>{% endif %}
  </figure>
  {% endif %}

  {{ content }}
</article>
