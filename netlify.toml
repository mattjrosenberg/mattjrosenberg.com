[build]
  command = "jekyll build && npx pagefind --site _site"
  publish = "_site"

[build.environment]
  RUBY_VERSION = "3.3.6"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://identity.netlify.com https://umami-matthew-rosenbergs-projects-f7e24785.vercel.app; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob:; font-src 'self' https://unpkg.com; frame-src 'self' https://identity.netlify.com https://open.spotify.com; connect-src 'self' https://api.netlify.com https://*.netlify.com https://identity.netlify.com https://umami-matthew-rosenbergs-projects-f7e24785.vercel.app"
