<style>
  #tooltip-wrapper {
    background: var(--bg-primary);
    padding: 1em;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    overflow: hidden;
    position: absolute;
    width: 400px;
    height: 250px;
    font-size: 0.8em;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
    opacity: 0;
    transition: opacity 100ms;
  }

  #tooltip-wrapper::after {
    content: "";
    position: absolute;
    z-index: 1;
    bottom: 0;
    left: 0;
    pointer-events: none;
    background-image: linear-gradient(to bottom, transparent, var(--bg-primary) 90%);
    width: 100%;
    height: 75px;
  }
</style>

<div style="opacity: 0; display: none;" id="tooltip-wrapper">
  <div id="tooltip-content"></div>
</div>

<iframe style="display: none; height: 0; width: 0;" id="link-preview-iframe" src=""></iframe>

<script>
  var opacityTimeout;
  var contentTimeout;
  var transitionDurationMs = 100;

  var iframe = document.getElementById('link-preview-iframe');
  var tooltipWrapper = document.getElementById('tooltip-wrapper');
  var tooltipContent = document.getElementById('tooltip-content');

  function hideTooltip() {
    opacityTimeout = setTimeout(function() {
      tooltipWrapper.style.opacity = 0;
      contentTimeout = setTimeout(function() {
        tooltipContent.innerHTML = '';
        tooltipWrapper.style.display = 'none';
      }, transitionDurationMs + 1);
    }, transitionDurationMs);
  }

  function showTooltip(event) {
    var elem = event.target;
    var elemRect = elem.getClientRects()[elem.getClientRects().length - 1];
    var scrollTop = window.pageYOffset || document.documentElement.scrollTop;

    if (event.target.host !== window.location.host) return;

    iframe.src = event.target.href;
    iframe.onload = function() {
      // Content is from same-origin pages only (guarded by host check above)
      var tooltipHtml = '<div style="font-weight: bold;">'
        + iframe.contentWindow.document.querySelector('h1').innerHTML
        + '</div>'
        + iframe.contentWindow.document.querySelector('content').innerHTML;

      tooltipContent.innerHTML = tooltipHtml;
      tooltipWrapper.style.display = 'block';
      setTimeout(function() {
        tooltipWrapper.style.opacity = 1;
      }, 1);
    };

    // Horizontal positioning
    tooltipWrapper.style.left = elemRect.left - (tooltipWrapper.offsetWidth / 2) + (elemRect.width / 2) + "px";

    // Vertical positioning
    if ((window.innerHeight - elemRect.top) < tooltipWrapper.offsetHeight) {
      tooltipWrapper.style.top = elemRect.top + scrollTop - tooltipWrapper.offsetHeight - 10 + "px";
    } else {
      tooltipWrapper.style.top = elemRect.top + scrollTop + 35 + "px";
    }

    // Clamp to viewport edges
    if ((elemRect.left + (elemRect.width / 2)) < (tooltipWrapper.offsetWidth / 2)) {
      tooltipWrapper.style.left = "10px";
    } else if ((document.body.clientWidth - elemRect.left - (elemRect.width / 2)) < (tooltipWrapper.offsetWidth / 2)) {
      tooltipWrapper.style.left = document.body.clientWidth - tooltipWrapper.offsetWidth - 20 + "px";
    }
  }

  function setupListeners(linkElement) {
    linkElement.addEventListener('mouseleave', function() { hideTooltip(); });
    tooltipWrapper.addEventListener('mouseleave', function() { hideTooltip(); });

    linkElement.addEventListener('mouseenter', function(event) {
      clearTimeout(opacityTimeout);
      clearTimeout(contentTimeout);
      showTooltip(event);
    });

    tooltipWrapper.addEventListener('mouseenter', function() {
      clearTimeout(opacityTimeout);
      clearTimeout(contentTimeout);
    });
  }

  document.querySelectorAll('{{ include.wrapperQuerySelector }} a').forEach(setupListeners);
</script>
